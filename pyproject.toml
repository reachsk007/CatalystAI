[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalystai"
version = "0.1.0"
description = "Explainable investment research scoring engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
catalystai = "catalystai.cli:main"

[tool.setuptools]
package-dir = {"" = "engine"}

[tool.setuptools.packages.find]
where = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

